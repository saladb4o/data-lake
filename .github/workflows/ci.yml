name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (deterministic tier)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify the app imports
        run: python -c "import server; print(f'{len(server.app.routes)} routes registered')"

      - name: Run Test Suite
        # Network-marked tests hit live upstreams (vnstock is rate-limited to
        # 60 req/min on the community tier) and cannot gate CI. See tests/conftest.py.
        run: python -m pytest -m "not network" --durations=10
