name: Screener Universe Sync

# Builds data/screener_snapshot.json on a clean runner and publishes it as a
# private artifact.
#
# Why here rather than on a laptop: the sync now queries VNDIRECT Finfo for
# every symbol TradingView leaves without statements, which is roughly half
# the universe. That is hundreds of requests, and on a Windows machine with
# TLS-intercepting antivirus it is also the step most likely to fail on
# certificate verification. A runner has a clean network and finishes in
# minutes.
#
# The snapshot is uploaded as an artifact, NOT committed. This repository is
# public, and committing the snapshot would publish the whole fundamentals
# lake to anyone who visits it. Download the artifact from the run page and
# drop it into your data directory.

on:
  workflow_dispatch:
    inputs:
      audit_after:
        description: 'Chạy audit độ phủ sau khi sync (true/false)'
        required: false
        default: 'true'
      vendor_census:
        # 'landbank' asks one question - does VNDIRECT carry the land bank
        # and the loan book, and under which item codes - in a few hundred
        # requests and a table short enough to read from a log tail. 'true'
        # is the whole survey, several thousand requests and 1400 lines.
        description: 'Census nguồn dữ liệu: false | landbank | cashflow | true'
        required: false
        default: 'false'
      census_limit:
        description: 'Số mã cho mỗi nguồn khi census (0 = tất cả)'
        required: false
        default: '0'
      # BOOTSTRAP - remove once fundamentals_lake.yml is on the default
      # branch. GitHub only offers workflow_dispatch for workflows that
      # exist on the default branch, so a new workflow on a feature branch
      # cannot be run at all, however correct it is. This input borrows
      # this workflow's registration to run that one's job. When it is set
      # the sync below does not run: the two are unrelated products and
      # nothing here reads the other's output.
      build_lake:
        description: 'BOOTSTRAP: build historical_fundamentals thay vì sync (0 = tắt, số = --limit, all = toàn bộ)'
        required: false
        default: '0'
      full_pass:
        description: 'BOOTSTRAP: chạy trọn gói đo đạc (true/false)'
        required: false
        default: 'false'
      filings_for:
        # One symbol, its latest BCTC, parsed - two minutes, no lake. The
        # PDF pipeline has never been measured on a document it fetched
        # itself: extracted_bctc_lake.json was built on a Windows machine
        # and every local_path in it still says C:\\Users\\Admin. CafeF is
        # refused from the dev container, so this is the only place the
        # question can be asked at all.
        description: 'Tải và parse BCTC mới nhất của MỘT mã: nhập mã (trống = tắt)'
        required: false
        default: ''
      analyse_run:
        # The expensive stages are fetches; every measurement that reads
        # them is seconds of arithmetic. Paying 43 minutes of universe +
        # prices + lake to re-print one table is what made each question
        # cost a run. Give this the run id of a completed full_pass and
        # its artifact is downloaded instead of rebuilt.
        description: 'Chỉ đo lại từ artifact của một run cũ: nhập run id (trống = tắt)'
        required: false
        default: ''
  schedule:
    # 06:00 sáng thứ Hai giờ VN = 23:00 UTC Chủ Nhật, after the weekly BCTC run.
    - cron: '0 23 * * 0'

concurrency:
  group: screener-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync universe and audit coverage
    if: ${{ (github.event.inputs.build_lake == '0' || github.event.inputs.build_lake == '') && github.event.inputs.full_pass != 'true' && github.event.inputs.analyse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync the universe
        env:
          # Keep every write inside the workspace. Without this the resolver
          # would look for a Google Drive mount that does not exist here.
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/sync_unified_market_data.py

      # The sync itself now refuses and exits non-zero when the master list
      # will not load, so this is a second line of defence rather than the
      # only one: it also catches a snapshot that was written and then
      # truncated.
      - name: Fail if the sync produced a thin universe
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["DATA_LOCAL_DIR"], "screener_snapshot.json")
          stocks = json.load(open(path, encoding="utf-8")).get("stocks", {})
          print(f"snapshot holds {len(stocks)} symbols")
          # A snapshot this small means the master list did not load or the
          # upstreams refused us. Publishing it would overwrite a good local
          # copy with a broken one.
          if len(stocks) < 100:
              sys.exit(f"refusing to publish a {len(stocks)}-symbol snapshot")
          PY


      # One large measurement instead of one workflow run per question.
      #
      # Every cycle of the coverage audit has cost a run to learn a single
      # fact, and several of those facts turned out to be about the question
      # rather than the data: TradingView columns requested at a period that
      # does not exist, VNDIRECT item codes that appear in no payload, a
      # reading of a numbering scheme that was wrong in all four parts. This
      # step asks every open question at once - which vendor serves what,
      # for which companies, under which field names, in which units - and
      # answers none of them. It fetches, counts and prints.
      #
      # It writes no valuation input and cannot: it runs after the snapshot
      # is already built and never reads back into it.
      - name: Census the vendor routes
        # Anything but false runs the census; which section is decided
        # below, by the same value. Listing the section names here as well
        # meant the two lists could disagree, and they did: a run asked for
        # 'cashflow', the condition did not name it, and the step was
        # skipped silently while the run looked like a success.
        if: ${{ github.event.inputs.vendor_census != 'false' && github.event.inputs.vendor_census != '' }}
        continue-on-error: true
        # The census shares the job's 60-minute budget with the sync, and it
        # is the step most likely to sit waiting: it talks to vendors nobody
        # here has measured, so nobody knows how they behave under a few
        # thousand requests. Without a bound of its own, one hanging route
        # would burn the job timeout and take the snapshot upload down with
        # it - losing the sync's output to a measurement that is optional.
        # Twenty-five minutes is far more than the observed cost at eight
        # workers; a census that exceeds it has found something worth
        # reporting as a timeout rather than waiting out.
        timeout-minutes: 25
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          # 'true' means the whole census; any other value names the one
          # section to run and is handed straight to --only, which rejects
          # a name it does not have rather than quietly running everything.
          ONLY="${{ github.event.inputs.vendor_census }}"
          if [ "$ONLY" = "true" ]; then ONLY=all; fi
          # Appended, not written: the audit below adds the coverage
          # headline to the same summary, and the summary is the one
          # channel that does not depend on reading a log from its tail.
          python scripts/vendor_census.py \
            --only "$ONLY" \
            --limit "${{ github.event.inputs.census_limit || '0' }}" \
            --workers 8 \
            --json "$DATA_LOCAL_DIR/vendor_census.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The audit runs LAST, after the census, and that ordering is load-
      # bearing rather than tidy. A job log can only be read from its tail,
      # and the census prints several hundred lines; with the audit before
      # it, the one number the whole exercise is measured by - the coverage
      # headline - is pushed out of every readable region of the log. That
      # happened on run 27 and cost a second run to recover a figure that
      # had already been computed. Whatever is printed last is the only
      # thing guaranteed to be readable, so the headline goes there.
      #
      # It reads the snapshot the sync wrote, exactly as the census does,
      # and neither reads the other's output - so the order is free to
      # choose on readability alone.
      - name: Audit valuation coverage
        if: ${{ github.event.inputs.audit_after != 'false' }}
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
        run: |
          python scripts/audit_valuation_coverage.py \
            --show-blocked 20 --json "$DATA_LOCAL_DIR/coverage.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the snapshot
        uses: actions/upload-artifact@v4
        with:
          name: screener_snapshot
          path: |
            data/screener_snapshot.json
            data/coverage.json
            data/vendor_census.json
          retention-days: 14
          if-no-files-found: error

  lake:
    name: BOOTSTRAP - build the quarterly lake
    if: ${{ github.event.inputs.build_lake != '0' && github.event.inputs.build_lake != '' && github.event.inputs.full_pass != 'true' && github.event.inputs.analyse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the lake
        env:
          # Keep every write inside the workspace, as the screener sync
          # does: without this the resolver looks for a Drive mount that
          # does not exist on a runner.
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          set -o pipefail
          ARGS="--universe"
          LIMIT="${{ github.event.inputs.build_lake }}"
          if [ "$LIMIT" != "all" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          echo "build_historical_fundamentals.py $ARGS"
          START=$(date +%s)
          python scripts/build_historical_fundamentals.py $ARGS \
            --out "$DATA_LOCAL_DIR/historical_fundamentals.json"
          echo "elapsed_seconds=$(( $(date +%s) - START ))"

      # The lake has never been built before, so counting symbols is not
      # enough: the question is whether the fields in it are the fields we
      # think we extracted. Two of them were wrong in this script until
      # recently - cfo read an adjustment line instead of the operating
      # section total, and debt was assigned from total liabilities - and
      # both failures are invisible in a symbol count. They are visible
      # here, as a fill rate and as an equality that should now be rare.
      #
      # This never writes; it reads the file the step above produced.
      - name: Read back what was written
        if: always()
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          from collections import Counter

          sys.path.insert(0, os.getcwd())
          # The judge of a usable record is imported, not restated. A
          # list of field names copied into this workflow would be one
          # more copy that cannot hear about a change - which is the
          # defect this whole build was cleaned up to remove.
          from services.point_in_time_fundamentals import (
              MIN_REQUIRED_FIELDS, _usable_field_count)

          path = os.path.join(os.environ["DATA_LOCAL_DIR"],
                              "historical_fundamentals.json")
          if not os.path.exists(path):
              sys.exit(f"no lake at {path}")
          lake = json.load(open(path, encoding="utf-8"))
          symbols = lake.get("symbols", {})

          records = []
          for sym, entry in symbols.items():
              for code, rec in (entry.get("quarters") or {}).items():
                  records.append((sym, code, rec))

          print("## Historical fundamentals lake")
          print()
          print(f"- symbols: **{len(symbols)}**")
          print(f"- quarter records: **{len(records)}**")
          if not records:
              sys.exit("the lake holds no quarter records")

          quarters = sorted({c for _, c, _ in records})
          print(f"- quarters: {quarters[0]} .. {quarters[-1]} "
                f"({len(quarters)} distinct)")
          per = Counter(s for s, _, _ in records)
          print(f"- quarters per symbol: min {min(per.values())}, "
                f"median {sorted(per.values())[len(per)//2]}, "
                f"max {max(per.values())}")
          print()

          fields = Counter()
          for _, _, rec in records:
              fields.update(k for k, v in rec.items() if v is not None)
          n = len(records)
          print("| field | records | fill |")
          print("|---|---:|---:|")
          for name, count in fields.most_common():
              print(f"| {name} | {count} | {100.0 * count / n:.1f}% |")
          print()

          # The signature of the bug that used to live here: debt was
          # total_liabilities, so the two were equal in every record. A
          # handful of genuine matches is possible; a majority means the
          # assignment came back.
          both = [r for _, _, r in records
                  if r.get("debt") is not None
                  and r.get("total_liabilities") is not None]
          same = sum(1 for r in both
                     if abs(r["debt"] - r["total_liabilities"]) < 1.0)
          if both:
              print(f"- debt == total_liabilities in **{same}/{len(both)}** "
                    f"({100.0 * same / len(both):.1f}%) - this was 100% "
                    "while debt was assigned from liabilities")

          # Four fields came back at almost exactly half on the first
          # build - gross_ppe, depreciation, debt, cash - while assets
          # and equity were at 99.5%. A fill rate cannot say which half.
          # A hole spread across symbols (entity forms filing under codes
          # we do not read) and a hole spread across time (a code that
          # starts at some quarter) both print 53%, and the fix for each
          # is a different one. So report both shapes per field.
          print()
          print("| field | symbols with it | first quarter | last quarter |")
          print("|---|---:|---|---|")
          for name in sorted(fields):
              if name.startswith(("filing_", "fiscal_")):
                  continue
              syms = {s for s, _, r in records if r.get(name) is not None}
              qs = sorted(c for _, c, r in records if r.get(name) is not None)
              print(f"| {name} | {len(syms)}/{len(symbols)} | {qs[0]} | {qs[-1]} |")

          # A record is only usable by the backtest when it carries at
          # least MIN_REQUIRED_FIELDS of the fields that mode counts.
          usable = sum(1 for _, _, r in records
                       if _usable_field_count(r) >= MIN_REQUIRED_FIELDS)
          print(f"- records with >= {MIN_REQUIRED_FIELDS} scored fields: "
                f"**{usable}/{n}** ({100.0 * usable / n:.1f}%)")
          PY

      - name: Upload the lake
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical_fundamentals
          path: data/historical_fundamentals.json
          retention-days: 14
          if-no-files-found: error

  measure:
    name: BOOTSTRAP - measure everything in one pass
    if: ${{ github.event.inputs.full_pass == 'true' && github.event.inputs.analyse_run == '' }}
    runs-on: ubuntu-latest
    # The pass builds three lakes and then runs every measurement that
    # reads them. The one unknown is the price sync, which has never run
    # on a runner and takes no limit, so the budget is generous.
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Universe and screener snapshot
        timeout-minutes: 40
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          LAKE_LIMIT: ${{ github.event.inputs.census_limit || '0' }}
        run: bash scripts/run_the_measurement_pass.sh universe

      # Measured, not guessed: a cancelled run reached symbols starting
      # with C after 21 minutes - roughly a fifth of 1,523 - so the full
      # pass is 1.5 to 2 hours. It runs 10 workers already; the limit is
      # the shared rate-limit bucket, not concurrency. 60 minutes would
      # have killed it every time, at the two-thirds mark.
      - name: Historical prices
        timeout-minutes: 180
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          LAKE_LIMIT: ${{ github.event.inputs.census_limit || '0' }}
        run: bash scripts/run_the_measurement_pass.sh prices

      - name: Fundamentals lake and code probe
        timeout-minutes: 60
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          LAKE_LIMIT: ${{ github.event.inputs.census_limit || '0' }}
        run: bash scripts/run_the_measurement_pass.sh lake

      - name: Score capex and depreciation codes
        timeout-minutes: 10
        if: always()
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          LAKE_LIMIT: ${{ github.event.inputs.census_limit || '0' }}
        run: bash scripts/run_the_measurement_pass.sh codes

      - name: What the lake could fill
        timeout-minutes: 20
        if: always()
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          LAKE_LIMIT: ${{ github.event.inputs.census_limit || '0' }}
        run: bash scripts/run_the_measurement_pass.sh lakefill

      - name: Backtest sweep
        timeout-minutes: 90
        if: always()
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          LAKE_LIMIT: ${{ github.event.inputs.census_limit || '0' }}
        run: bash scripts/run_the_measurement_pass.sh backtest

      - name: Which item code is capex
        timeout-minutes: 25
        if: always()
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          LAKE_LIMIT: ${{ github.event.inputs.census_limit || '0' }}
        run: bash scripts/run_the_measurement_pass.sh capexmatch

      - name: Four questions, no fetches
        timeout-minutes: 15
        if: always()
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
        run: bash scripts/run_the_measurement_pass.sh probe

      - name: Coverage audit
        timeout-minutes: 30
        if: always()
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          LAKE_LIMIT: ${{ github.event.inputs.census_limit || '0' }}
        run: bash scripts/run_the_measurement_pass.sh audit

      # if: always() throughout. A pass that lost a stage still built
      # whatever came before it, and that is the expensive part.
      - name: Upload everything the pass produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement_pass
          path: |
            data/historical_fundamentals.json
            data/screener_snapshot.json
            data/historical_prices.json
            data/coverage.json
            data/backtest_sweep.json
            data/code_candidates.json
            data/code_candidates_probe.json
            data/lake_fill.json
            data/capex_match.json
          retention-days: 14
          if-no-files-found: warn

  analyse:
    name: Re-measure a previous pass without refetching anything
    if: ${{ github.event.inputs.analyse_run != '' }}
    runs-on: ubuntu-latest
    # Ninety seconds of arithmetic in the observed pass. Ten minutes is
    # already an alarm rather than a budget.
    timeout-minutes: 20
    permissions:
      contents: read
      # download-artifact needs this to reach a *different* run's
      # artifacts; without it the download fails with a 403 that reads
      # like the artifact expired.
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch the lakes the named run already built
        uses: actions/download-artifact@v4
        with:
          name: measurement_pass
          path: data
          run-id: ${{ github.event.inputs.analyse_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Say what arrived before measuring it. An analysis run that quietly
      # read a half-downloaded artifact would print a coverage figure that
      # looks like a finding and is an accident.
      - name: What arrived
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
        run: |
          {
            echo "## Re-measuring run ${{ github.event.inputs.analyse_run }}"
            echo
            echo "| file | bytes |"
            echo "|---|---:|"
            for f in data/*.json; do
              [ -e "$f" ] && echo "| $(basename "$f") | $(wc -c < "$f") |"
            done
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -s data/screener_snapshot.json

      - name: Measure, fetching nothing
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
        run: bash scripts/run_the_measurement_pass.sh codes lakefill backtest probe audit

      - name: Upload what the measurements produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement_only
          path: |
            data/coverage.json
            data/backtest_sweep.json
            data/code_candidates.json
            data/lake_fill.json
            data/capex_match.json
          retention-days: 14
          if-no-files-found: warn

  filings:
    name: One symbol's latest filings, fetched and parsed
    if: github.event.inputs.filings_for != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and parse
        timeout-minutes: 15
        env:
          DATA_LOCAL_DIR: ${{ github.workspace }}/data
          GOOGLE_DRIVE_DATA_DIR: ${{ github.workspace }}/no-such-drive
        run: |
          python scripts/fetch_one_symbols_filings.py \
            "${{ github.event.inputs.filings_for }}" \
            --limit 3 | tee -a "$GITHUB_STEP_SUMMARY"
